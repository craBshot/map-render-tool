# Fixed project name: keeps the area-db volume name stable no matter which
# folder the repo is cloned into.
name: map-render-tool

services:
  map-render-tool:
    build:
      context: .
      target: final
    container_name: map-render-tool
    restart: unless-stopped
    # Reachable on port 8080 from other machines in the network as well (all
    # interfaces). To allow only the host itself, e.g. behind a reverse proxy
    # running there, use "127.0.0.1:8080:80" instead.
    ports:
      - "8080:80"
    depends_on:
      - area-db-worker

  # Slowly, continuously builds a local database of administrative
  # boundaries and protected areas in the background (see CLAUDE.md), so
  # right-click area lookups don't depend on the shared public Overpass
  # instance being reachable. No externally published port — nginx reaches
  # it internally by service name (see nginx.conf's /area-db/ proxy).
  area-db-worker:
    build:
      context: .
      target: worker
    container_name: area-db-worker
    restart: unless-stopped
    volumes:
      - area-db-data:/data/area-db

volumes:
  area-db-data:
