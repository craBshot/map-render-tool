# Caddy sits in front of this container in the real deployment (TLS,
# routing, WireGuard-only access) — this only serves the static build.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Local area database (see CLAUDE.md) — short timeouts so a slow/absent
    # worker never blocks the UI; areaLookup.ts treats any failure here as a
    # local miss and falls back to live Overpass.
    # nginx's stock mime.types doesn't know .mjs (MapLibre's worker), and
    # browsers refuse to start a module worker served as octet-stream.
    location ~ \.mjs$ {
        types { }
        default_type application/javascript;
    }

    location /area-db/ {
        proxy_pass http://area-db-worker:8081/;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }
}
